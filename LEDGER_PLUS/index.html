<!DOCTYPE html>
<html lang="it">
<head>
  <title>Tesi AR - Ledger Nano S Plus</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
    // I materiali metallici non hanno colore proprio: mostrano quello che riflettono.
    // Senza una mappa d'ambiente riflettono il vuoto e risultano neri. Qui ne creo una
    // da una scena grigia e la applico a tutta la scena; il tone mapping ACES comprime
    // le alte luci invece di tagliarle a bianco pieno.
    AFRAME.registerComponent('env-lighting', {
      init: function () {
        this.el.addEventListener('renderstart', () => {
          var renderer = this.el.renderer;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          var pmrem = new THREE.PMREMGenerator(renderer);
          var envScene = new THREE.Scene();
          envScene.background = new THREE.Color(0x999999);
          this.el.object3D.environment = pmrem.fromScene(envScene, 0.04).texture;
          pmrem.dispose();
        });
      }
    });
  </script>
</head>

<body style="margin: 0px; overflow: hidden;">
  <a-scene
    env-lighting
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; smooth: true; smoothCount: 10; smoothTolerance: 0.01; patternRatio: 0.9;">

    <a-assets>
      <a-asset-item id="ledger" src="Ledger_Nano_S_Plus.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="pattern-Ledger_Nano_S_Plus.patt">
      <a-entity id="model-ledger" gltf-model="#ledger" scale="10 10 10" position="0.084 0.025 0.035" rotation="0 0 0"></a-entity>
    </a-marker>

    <a-entity light="type: ambient; color: #FFF; intensity: 1.3"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.0" position="0.5 1 2"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.5" position="-1 0.5 1"></a-entity>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
