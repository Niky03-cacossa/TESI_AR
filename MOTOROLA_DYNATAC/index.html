<html>
<head>
  <title>Tesi AR - Motorola DynaTAC</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: true; smooth: true; smoothCount: 10; smoothTolerance: 0.01;">

    <a-assets>
      <a-asset-item id="dynatac" src="MOTOROLA_DYNATAC_8000X.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="marker-dynatac.patt">

     <a-entity gltf-model="#dynatac" scale="2 2 2" position="0 0 0" rotation="0 0 0"></a-entity>

    </a-marker>

    <a-entity light="type: ambient; color: #FFF; intensity: 1.6"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.3" position="0.5 1 2"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-1 0.5 1"></a-entity>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
