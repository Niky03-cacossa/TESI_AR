<!DOCTYPE html>
<html lang="it">
<head>
  <title>Tesi AR - Apple Vision Pro</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script>

<body style="margin: 0px; overflow: hidden;">
  <a-scene
    env-lighting
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; smooth: true; smoothCount: 10; smoothTolerance: 0.01; patternRatio: 0.9;">

    <a-assets>
      <a-asset-item id="visionpro" src="Apple_Vision_Pro.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="pattern-Apple_Vision_Pro.patt">
      <a-entity id="model-visionpro" gltf-model="#visionpro" scale="4 4 4" position="0.003 0.005 -0.006" rotation="0 0 0"></a-entity>
    </a-marker>

    <a-entity light="type: ambient; color: #FFF; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.8" position="1.5 2 1"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.4" position="-1 0.5 1"></a-entity>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
