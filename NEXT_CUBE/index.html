<!DOCTYPE html>
<html>
<head>
  <title>Tesi AR - NeXT Cube</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
    // Genera una mappa d'ambiente (image-based lighting) procedurale, necessaria perche'
    // i materiali metallici senza luce d'ambiente riflessa risultano neri o piatti.
    AFRAME.registerComponent('env-lighting', {
      init: function () {
        var sceneEl = this.el;
        var doIt = function () {
          var renderer = sceneEl.renderer;
          var pmremGenerator = new THREE.PMREMGenerator(renderer);
          pmremGenerator.compileEquirectangularShader();

          var envScene = new THREE.Scene();
          var skyGeo = new THREE.SphereGeometry(50, 32, 32);
          var skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: {
              topColor: { value: new THREE.Color(0xffffff) },
              bottomColor: { value: new THREE.Color(0x666666) }
            },
            vertexShader: "varying vec3 vWorldPosition; void main() { vec4 worldPosition = modelMatrix * vec4(position, 1.0); vWorldPosition = worldPosition.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
            fragmentShader: "uniform vec3 topColor; uniform vec3 bottomColor; varying vec3 vWorldPosition; void main() { float h = normalize(vWorldPosition).y; gl_FragColor = vec4(mix(bottomColor, topColor, max(h * 0.5 + 0.5, 0.0)), 1.0); }"
          });
          envScene.add(new THREE.Mesh(skyGeo, skyMat));

          function addPanel(x, y, z, w, h, color) {
            var mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: color }));
            mesh.position.set(x, y, z);
            mesh.lookAt(0, 0, 0);
            envScene.add(mesh);
          }
          addPanel(8, 10, 8, 10, 10, 0xffffff);
          addPanel(-8, 4, -8, 6, 6, 0xffe0b0);
          addPanel(0, -8, 6, 8, 8, 0x333333);

          var envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
          sceneEl.object3D.environment = envMap;
          pmremGenerator.dispose();
        };
        if (sceneEl.hasLoaded) { doIt(); } else { sceneEl.addEventListener('loaded', doIt); }
      }
    });
  </script>
</head>

<body style="margin: 0px; overflow: hidden;">
  <a-scene
    env-lighting
    embedded
    arjs="sourceType: webcam; debugUIEnabled: true; smooth: true; smoothCount: 10; smoothTolerance: 0.01;">

    <a-assets>
      <a-asset-item id="nextcube" src="NeXT_Cube.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="pattern-NeXT_Cube.patt">

      <!-- ROTAZIONE DA VERIFICARE: parti da questa, se il cubo è storto/sdraiato
           dimmi come appare (es. "sdraiato su un fianco", "capovolto") e la correggo,
           esattamente come abbiamo fatto per il Motorola. -->
      <a-entity gltf-model="#nextcube" scale="2 2 2" position="-0.366 0.004 -0.502" rotation="0 0 0"></a-entity>

    </a-marker>

    <a-entity light="type: ambient; color: #FFF; intensity: 1.0"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="0.5 1 2"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.35" position="-1 0.5 1"></a-entity>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
