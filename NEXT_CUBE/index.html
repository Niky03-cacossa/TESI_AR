<!DOCTYPE html>
<html>
<head>
  <title>Tesi AR - NeXT Cube</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
    // Debug: forza i materiali a essere visibili da entrambi i lati (evita che il
    // modello risulti invisibile per via del backface culling se la rotazione
    // di partenza mostra il "dietro" della mesh verso la camera).
    AFRAME.registerComponent('force-doubleside', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          this.el.object3D.traverse((node) => {
            if (node.isMesh && node.material) {
              if (Array.isArray(node.material)) {
                node.material.forEach(m => { m.side = THREE.DoubleSide; });
              } else {
                node.material.side = THREE.DoubleSide;
              }
            }
          });
        });
      }
    });

    AFRAME.registerComponent('env-lighting', {
      init: function () {
        const sceneEl = this.el;
        sceneEl.addEventListener('renderstart', () => {
          const renderer = sceneEl.renderer;
          const pmremGenerator = new THREE.PMREMGenerator(renderer);
          const envScene = new THREE.Scene();
          envScene.background = new THREE.Color(0x888888);
          const envTexture = pmremGenerator.fromScene(envScene, 0.04).texture;
          sceneEl.object3D.environment = envTexture;
          pmremGenerator.dispose();
        });
      }
    });
  </script>
</head>

<body style="margin: 0px; overflow: hidden;">
  <a-scene
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/"
    embedded
    env-lighting
    arjs="sourceType: webcam; debugUIEnabled: false; smooth: true; smoothCount: 10; smoothTolerance: 0.01; patternRatio: 0.9;">

    <a-assets>
     <a-asset-item id="nextcube" src="NeXT_Cube.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="pattern-NeXT_Cube.patt">
      <a-entity id="model-nextcube" force-doubleside gltf-model="#nextcube" scale="4 4 4" position="-0.366 0.004 -0.9" rotation="0 0 0"></a-entity>
    </a-marker>

    <a-entity light="type: ambient; color: #FFF; intensity: 2.5"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 2.8" position="0.5 1 2"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 2.9" position="-1 0.5 1"></a-entity>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
