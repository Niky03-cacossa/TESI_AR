<!DOCTYPE html>
<html lang="it">
<head>
  <title>Tesi AR - NeXT Cube</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
    // Un oggetto metallico non ha un colore suo: mostra quello che ha intorno.
    // In una pagina web non ha niente intorno, quindi riflette il vuoto e sembra nero.
    // Qui gli creo intorno una scena grigia da riflettere, e attenuo le luci troppo forti.
    // Il grigio qui e' piu' chiaro che negli altri file, e l'esposizione piu' alta,
    // perche' il NeXT Cube e' nero e quasi tutto metallico: con i valori standard
    // il case e il monitor non lasciavano leggere nessun dettaglio.
    AFRAME.registerComponent('env-lighting', {
      init: function () {
        this.el.addEventListener('renderstart', () => {
          var renderer = this.el.renderer;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.4;
          var pmrem = new THREE.PMREMGenerator(renderer);
          var envScene = new THREE.Scene();
          envScene.background = new THREE.Color(0xcccccc);
          this.el.object3D.environment = pmrem.fromScene(envScene, 0.04).texture;
          pmrem.dispose();
        });
      }
    });
  </script>
</head>

<body style="margin: 0px; overflow: hidden;">
  <a-scene
    env-lighting
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; smooth: true; smoothCount: 10; smoothTolerance: 0.01; patternRatio: 0.9;">

    <a-assets>
      <a-asset-item id="nextcube" src="NeXT_Cube.glb?v=2"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="pattern-NeXT_Cube.patt">
      <a-entity id="model-nextcube" gltf-model="#nextcube" scale="4 4 4" position="-0.366 0.004 -2" rotation="0 0 0"></a-entity>
    </a-marker>

    <a-entity light="type: ambient; color: #FFF; intensity: 3"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 3" position="0.5 1 2"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 3" position="-1 0.5 1"></a-entity>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
