<!DOCTYPE html>
<html>
<head>
  <title>Viewer - Ledger Nano S Plus</title>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #2b2b2b; }
    #live-panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.75); color: #fff;
      font-family: sans-serif; font-size: 13px; padding: 8px; z-index: 9999;
    }
    #live-values { text-align: center; margin-bottom: 6px; font-weight: bold; }
    #live-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
    #live-buttons button {
      padding: 8px 12px; font-size: 14px; border-radius: 6px;
      border: none; background: #444; color: #fff; cursor: pointer;
    }
    #hint {
      position: fixed; top: 10px; left: 10px; color: #fff;
      font-family: sans-serif; font-size: 13px; background: rgba(0,0,0,0.5);
      padding: 6px 10px; border-radius: 6px;
    }
  </style>
  <script>
    // trascina col mouse per ruotare l'oggetto, rotellina per zoomare
    AFRAME.registerComponent('drag-rotate', {
      init: function () {
        this.dragging = false;
        this.lastX = 0; this.lastY = 0;
        const el = this.el;
        const canvas = () => document.querySelector('canvas');
        document.addEventListener('mousedown', (e) => {
          this.dragging = true; this.lastX = e.clientX; this.lastY = e.clientY;
        });
        document.addEventListener('mouseup', () => { this.dragging = false; });
        document.addEventListener('mousemove', (e) => {
          if (!this.dragging) return;
          const dx = e.clientX - this.lastX;
          const dy = e.clientY - this.lastY;
          this.lastX = e.clientX; this.lastY = e.clientY;
          const rot = el.getAttribute('rotation');
          el.setAttribute('rotation', {
            x: rot.x - dy * 0.3,
            y: rot.y + dx * 0.3,
            z: rot.z
          });
        });
        // touch (mac trackpad / mobile)
        document.addEventListener('touchstart', (e) => {
          this.dragging = true; this.lastX = e.touches[0].clientX; this.lastY = e.touches[0].clientY;
        });
        document.addEventListener('touchend', () => { this.dragging = false; });
        document.addEventListener('touchmove', (e) => {
          if (!this.dragging) return;
          const dx = e.touches[0].clientX - this.lastX;
          const dy = e.touches[0].clientY - this.lastY;
          this.lastX = e.touches[0].clientX; this.lastY = e.touches[0].clientY;
          const rot = el.getAttribute('rotation');
          el.setAttribute('rotation', {
            x: rot.x - dy * 0.3,
            y: rot.y + dx * 0.3,
            z: rot.z
          });
        });
      }
    });
    AFRAME.registerComponent('wheel-zoom', {
      init: function () {
        const cam = this.el;
        document.addEventListener('wheel', (e) => {
          const pos = cam.getAttribute('position');
          let z = pos.z + e.deltaY * 0.002;
          z = Math.max(0.3, Math.min(6, z));
          cam.setAttribute('position', { x: pos.x, y: pos.y, z: z });
        }, { passive: true });
      }
    });
  </script>
</head>
<body>
  <div id="hint">Trascina per ruotare &middot; rotellina per zoomare</div>
  <button id="open-inspector" style="position:fixed; top:10px; right:10px; z-index:9999; padding:10px 14px; font-size:14px; border-radius:6px; border:none; background:#2a6df5; color:#fff; cursor:pointer;">Apri editor 3D</button>
  <div id="live-panel">
    <div id="live-values"></div>
    <div id="live-buttons"></div>
  </div>

  <a-scene embedded style="width:100vw; height:100vh;" background="color:#2b2b2b" gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/">
    <a-assets>
      <a-asset-item id="ledger" src="Ledger_Nano_S_Plus.glb"></a-asset-item>
    </a-assets>

    <a-entity id="model-ledger" drag-rotate gltf-model="#ledger" scale="9 9 9" position="0.084 0.025 0.035" rotation="0 0 0"></a-entity>

    <a-entity light="type: ambient; color: #FFF; intensity: 1.3"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.0" position="0.5 1 2"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.5" position="-1 0.5 1"></a-entity>

    <a-entity wheel-zoom camera position="0 0 1.5"></a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const el = document.querySelector('#model-ledger');
      const valuesEl = document.querySelector('#live-values');
      const btnsEl = document.querySelector('#live-buttons');

      function getVal() {
        const p = el.getAttribute('position');
        const s = el.getAttribute('scale');
        return { p, s: s.x };
      }
      function render() {
        const { p, s } = getVal();
        valuesEl.textContent =
          `pos: ${p.x.toFixed(3)} ${p.y.toFixed(3)} ${p.z.toFixed(3)}   scale: ${s.toFixed(2)}`;
      }
      function nudgePos(axis, delta) {
        const p = el.getAttribute('position');
        p[axis] += delta;
        el.setAttribute('position', p);
        render();
      }
      function nudgeScale(delta) {
        const { s } = getVal();
        const ns = Math.max(0.1, s + delta);
        el.setAttribute('scale', `${ns} ${ns} ${ns}`);
        render();
      }

      const step = 0.02;
      const buttons = [
        ['X −', () => nudgePos('x', -step)],
        ['X +', () => nudgePos('x', step)],
        ['Y −', () => nudgePos('y', -step)],
        ['Y +', () => nudgePos('y', step)],
        ['Z −', () => nudgePos('z', -step)],
        ['Z +', () => nudgePos('z', step)],
        ['Scale −', () => nudgeScale(-0.2)],
        ['Scale +', () => nudgeScale(0.2)],
      ];
      buttons.forEach(([label, fn]) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.addEventListener('click', fn);
        btnsEl.appendChild(b);
      });
      render();
    });
  </script>
<script>
  document.querySelector('#open-inspector').addEventListener('click', () => {
    // simula esattamente Ctrl+Alt+I (quello che la scorciatoia da tastiera farebbe),
    // così funziona anche quando il tasto fisico non arriva alla pagina (es. Option su Mac
    // usato per lettere accentate)
    window.dispatchEvent(new KeyboardEvent('keydown', {
      keyCode: 73, which: 73, key: 'i', code: 'KeyI',
      ctrlKey: true, altKey: true, bubbles: true
    }));
  });
</script>
</body>
</html>
