<!DOCTYPE html>
<html lang="it">
<head>
  <title>Tesi AR - Oura Ring</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
    // I materiali metallici non hanno colore proprio: mostrano quello che riflettono.
    // Senza una mappa d'ambiente riflettono il vuoto e risultano neri. Qui ne creo una
    // da una scena grigia e la applico a tutta la scena; il tone mapping ACES comprime
    // le alte luci invece di tagliarle a bianco pieno.

  </script>
</head>
    arjs="sourceType: webcam; debugUIEnabled: false; smooth: true; smoothCount: 10; smoothTolerance: 0.01; patternRatio: 0.9;">

    <a-assets>
      <a-asset-item id="oura" src="ouraring.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="pattern-ouraring.patt">
      <a-entity id="model-oura" gltf-model="#oura" scale="40 40 40" position="-0.006 0 0" rotation="0 0 0"></a-entity>
    </a-marker>

    <a-entity light="type: ambient; color: #FFF; intensity: 1.3"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.0" position="0.5 1 2"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.5" position="-1 0.5 1"></a-entity>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
