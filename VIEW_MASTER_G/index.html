<!DOCTYPE html>
<html>
<head>
  <title>Tesi AR - View-Master</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
    // Debug: forza i materiali a essere visibili da entrambi i lati (evita che il
    // modello risulti invisibile per via del backface culling se la rotazione
    // di partenza mostra il "dietro" della mesh verso la camera).
    AFRAME.registerComponent('force-doubleside', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          this.el.object3D.traverse((node) => {
            if (node.isMesh && node.material) {
              if (Array.isArray(node.material)) {
                node.material.forEach(m => { m.side = THREE.DoubleSide; });
              } else {
                node.material.side = THREE.DoubleSide;
              }
            }
          });
        });
      }
    });
  </script>
</head>

<body style="margin: 0px; overflow: hidden;">
  <a-scene
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: true; smooth: true; smoothCount: 10; smoothTolerance: 0.01;">

    <a-assets>
      <a-asset-item id="viewmaster" src="View-Master_G.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="pattern-View-Master_G.patt">

      <!-- ROTAZIONE DA VERIFICARE: come per gli altri, se esce storto dimmi come appare
           e la correggo. -->
      <a-entity id="model-viewmaster" force-doubleside gltf-model="#viewmaster" scale="2 2 2" position="0.011 0.014 0.197" rotation="0 0 0"></a-entity>

      <!-- DEBUG: sfera rossa sempre visibile sopra il marker, per capire se il marker
           viene tracciato anche quando il modello 3D non si vede. -->
      <a-sphere radius="0.05" color="red" position="0 0.15 0"></a-sphere>

    </a-marker>

    <a-entity light="type: ambient; color: #FFF; intensity: 1.3"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.0" position="0.5 1 2"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.5" position="-1 0.5 1"></a-entity>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
