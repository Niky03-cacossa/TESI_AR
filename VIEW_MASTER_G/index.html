<!DOCTYPE html>
<html>
<head>
  <title>Tesi AR - View-Master</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
    // Debug: forza i materiali a essere visibili da entrambi i lati (evita che il
    // modello risulti invisibile per via del backface culling se la rotazione
    // di partenza mostra il "dietro" della mesh verso la camera).
    AFRAME.registerComponent('force-doubleside', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          this.el.object3D.traverse((node) => {
            if (node.isMesh && node.material) {
              if (Array.isArray(node.material)) {
                node.material.forEach(m => { m.side = THREE.DoubleSide; });
              } else {
                node.material.side = THREE.DoubleSide;
              }
            }
          });
        });
      }
    });

    // Ambiente riflesso (image-based lighting) per i materiali metallici/PBR:
    // senza questa mappa d'ambiente, i materiali con metallicFactor alto
    // risultano neri o senza texture visibile (riflettono il "vuoto").
    AFRAME.registerComponent('env-lighting', {
      init: function () {
        var sceneEl = this.el;
        var doIt = function () {
          var renderer = sceneEl.renderer;
          var pmremGenerator = new THREE.PMREMGenerator(renderer);
          pmremGenerator.compileEquirectangularShader();

          var envScene = new THREE.Scene();

          var skyGeo = new THREE.SphereGeometry(50, 32, 32);
          var skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: {
              topColor: { value: new THREE.Color(0xffffff) },
              bottomColor: { value: new THREE.Color(0x666666) }
            },
            vertexShader: "varying vec3 vWorldPosition; void main() { vec4 worldPosition = modelMatrix * vec4(position, 1.0); vWorldPosition = worldPosition.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
            fragmentShader: "uniform vec3 topColor; uniform vec3 bottomColor; varying vec3 vWorldPosition; void main() { float h = normalize(vWorldPosition).y; gl_FragColor = vec4(mix(bottomColor, topColor, max(h * 0.5 + 0.5, 0.0)), 1.0); }"
          });
          var sky = new THREE.Mesh(skyGeo, skyMat);
          envScene.add(sky);

          function addPanel(x, y, z, w, h, color) {
            var mat = new THREE.MeshBasicMaterial({ color: color });
            var geo = new THREE.PlaneGeometry(w, h);
            var mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.lookAt(0, 0, 0);
            envScene.add(mesh);
          }
          addPanel(8, 10, 8, 10, 10, 0xffffff);
          addPanel(-8, 4, -8, 6, 6, 0xffe0b0);
          addPanel(0, -8, 6, 8, 8, 0x333333);

          var envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
          sceneEl.object3D.environment = envMap;
          pmremGenerator.dispose();
        };
        if (sceneEl.hasLoaded) { doIt(); } else { sceneEl.addEventListener('loaded', doIt); }
      }
    });
  </script>
</head>

<body style="margin: 0px; overflow: hidden;">
  <a-scene
    env-lighting
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: true; smooth: true; smoothCount: 10; smoothTolerance: 0.01; patternRatio: 0.9;">

    <a-assets>
      <a-asset-item id="viewmaster" src="View-Master_G.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="pattern-View-Master_G.patt">

      <!-- ROTAZIONE DA VERIFICARE: come per gli altri, se esce storto dimmi come appare
           e la correggo. -->
      <a-entity id="model-viewmaster" force-doubleside gltf-model="#viewmaster" scale="2 2 2" position="0.011 0.014 0.197" rotation="0 0 0"></a-entity>

    </a-marker>

    <a-entity light="type: ambient; color: #FFF; intensity: 1.3"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.0" position="0.5 1 2"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.5" position="-1 0.5 1"></a-entity>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
